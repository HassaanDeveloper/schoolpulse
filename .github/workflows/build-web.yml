name: Build Web
on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - name: Add web support
        working-directory: mobile
        run: flutter create . --platforms=web
      - name: Build web
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          echo "/* /index.html 200" > build/web/_redirects
      - uses: actions/upload-artifact@v4
        with:
          name: schoolpulse-web
          path: mobile/build/web
