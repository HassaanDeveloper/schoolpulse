[project]
name = "backend"
version = "0.2.0"
description = "SchoolPulse FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pytest>=8.3.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.31",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]