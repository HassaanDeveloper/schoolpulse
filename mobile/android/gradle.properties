# Day 7 build settings tuned for this machine (3.7 GB total RAM, 4 cores).
# The stock Flutter defaults request an 8 GB heap, which the Gradle daemon
# cannot reserve on this host and which caused "daemon disappeared
# unexpectedly" on every attempt.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# One worker, no parallel projects, no separate Kotlin daemon: each of those
# would need its own JVM heap, which this host cannot afford.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

# Keep the Gradle cache off the nearly-full C: drive.
org.gradle.java.home=E\:\\Android\\jdk17

android.useAndroidX=true
android.enableJetifier=true

# The Kotlin incremental-compilation caches could not be flushed after the
# daemon was killed, failing every plugin's compileReleaseKotlin task with
# "Could not close incremental caches". Compiling in-process, without
# incremental state, is slower but survives a low-memory host.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process